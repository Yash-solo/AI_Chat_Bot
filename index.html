<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Bot</title>
    <link rel="stylesheet" href="./src/input.css">
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class=" flex justify-center items-center overflow-y-auto">
    <div class="sidebar h-8 w-25 border border-white rounded-2xl flex items-center justify-center fixed top-5 left-5 bg-[rgba(255,255,255,0.5)] backdrop-blur-2xl">
        <button class="darkmode cursor-pointer font-mono font-bold">Dark Mode</button>
    </div>
    
    <div class="flex relative overflow-hidden flex-col items-center border rounded-2xl border-[rgba(255,255,255,0.5)] text-2xl  min-w-7/10 md:min-w-3/10 md:max-w-4/10  bg-[rgba(255,255,255,0.5)]">
        <h1 class="aiHead text-3xl md:text-4xl font-bold p-5 flex items-center justify-center text-gray-800 h-15 w-full  bg-[rgba(0,0,0,0.3)]">AI ChatBot 🤖</h1>
        <section class="chatSection  min-h-90 max-h-100 gap-5 w-full flex flex-col overflow-y-auto">
            
        </section>
        <div class="inputAndsend flex flex-row gap-2 justify-around items-center bg-[rgba(0,0,0,0.3)] w-full h-15">
            <input class="inputBox h-12 md:min-w-50 max-w-60 rounded-2xl bg-white "type="text" placeholder="type here">
            <button class="sendData cursor-pointer pr-3 overflow-hidden h-12 w-20 flex items-center justify-around rounded-full bg-blue-400"><svg xmlns="http://w3.org" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13" />
                <path d="M22 2L15 22L11 13L2 9L22 2Z" />
                </svg>
            </button>
        </div>
    </div>
    <script src="config.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
